[package]
name = "sqlite3-gcsrapid-vfs"
version = "0.1.0"
edition = "2021"
authors = ["Google Antigravity Team"]
description = "SQLite VFS using Google Cloud Storage Rapid appendable objects and Bidi streaming"

[lib]
name = "sqlite3_gcsrapid_vfs"
crate-type = ["cdylib", "rlib"]

[dependencies]
google-cloud-storage = { version = "1.21.0", features = ["unstable-stream"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
futures = "0.3"
crc32c = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
