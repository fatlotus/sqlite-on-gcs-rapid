name: Build SQLite VFS Extension

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-linux-64:
    name: Build 64-bit Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true

      - name: Install Bazel (fallback for act)
        run: |
          if ! command -v bazel &> /dev/null; then
            echo "Bazel not found. Installing Bazelisk..."
            sudo curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 || curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
            sudo chmod +x /usr/local/bin/bazel || chmod +x /usr/local/bin/bazel
          fi

      - name: Build targets
        run: |
          bazel build //:libsqlite3_gcsvfs.so //:compactor //:sqlite_log_tool \
            --features=-layering_check \
            --features=-use_header_modules \
            --features=-module_maps

      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite3_gcsvfs-linux-x86_64
          path: bazel-bin/libsqlite3_gcsvfs.so

      - name: Upload compactor artifact
        uses: actions/upload-artifact@v4
        with:
          name: compactor-linux-x86_64
          path: bazel-bin/compactor

      - name: Upload sqlite_log_tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite_log_tool-linux-x86_64
          path: bazel-bin/sqlite_log_tool

  build-macos-arm:
    name: Build ARM macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true

      - name: Build targets
        run: |
          bazel build //:libsqlite3_gcsvfs.so //:compactor //:sqlite_log_tool \
            --features=-layering_check \
            --features=-use_header_modules \
            --features=-module_maps \
            --macos_minimum_os=11.0

      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite3_gcsvfs-macos-arm64
          path: bazel-bin/libsqlite3_gcsvfs.so

      - name: Upload compactor artifact
        uses: actions/upload-artifact@v4
        with:
          name: compactor-macos-arm64
          path: bazel-bin/compactor

      - name: Upload sqlite_log_tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite_log_tool-macos-arm64
          path: bazel-bin/sqlite_log_tool

  release:
    name: Create GitHub Release
    needs: [build-linux-64, build-macos-arm]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate release version
        id: version
        run: |
          VERSION="v0.$(date -u +'%Y%m%d%H%M%S')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: libsqlite3_gcsvfs-linux-x86_64
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: libsqlite3_gcsvfs-macos-arm64
          path: ./artifacts/macos

      - name: Download Linux compactor artifact
        uses: actions/download-artifact@v4
        with:
          name: compactor-linux-x86_64
          path: ./artifacts/linux-compactor

      - name: Download macOS compactor artifact
        uses: actions/download-artifact@v4
        with:
          name: compactor-macos-arm64
          path: ./artifacts/macos-compactor

      - name: Download Linux sqlite_log_tool artifact
        uses: actions/download-artifact@v4
        with:
          name: sqlite_log_tool-linux-x86_64
          path: ./artifacts/linux-sqlite_log_tool

      - name: Download macOS sqlite_log_tool artifact
        uses: actions/download-artifact@v4
        with:
          name: sqlite_log_tool-macos-arm64
          path: ./artifacts/macos-sqlite_log_tool

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp ./artifacts/linux/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-linux-x86_64.so
          cp ./artifacts/macos/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-macos-arm64.so
          cp ./artifacts/macos/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-macos-arm64.dylib
          cp ./artifacts/linux-compactor/compactor release-assets/compactor-linux-x86_64
          cp ./artifacts/macos-compactor/compactor release-assets/compactor-macos-arm64
          cp ./artifacts/linux-sqlite_log_tool/sqlite_log_tool release-assets/sqlite_log_tool-linux-x86_64
          cp ./artifacts/macos-sqlite_log_tool/sqlite_log_tool release-assets/sqlite_log_tool-macos-arm64

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release-notes.md
          ### Usage Instructions

          To use the `appendonly` VFS extension:

          #### 1. Download the extension shared library for your platform:

          **macOS (Apple Silicon arm64):**
          ```bash
          curl -L -o libsqlite3_gcsvfs.dylib https://github.com/fatlotus/sqlite-on-gcs-rapid/releases/download/${{ steps.version.outputs.version }}/libsqlite3_gcsvfs-macos-arm64.dylib
          ```

          **Linux (x86_64):**
          ```bash
          curl -L -o libsqlite3_gcsvfs.so https://github.com/fatlotus/sqlite-on-gcs-rapid/releases/download/${{ steps.version.outputs.version }}/libsqlite3_gcsvfs-linux-x86_64.so
          ```

          > [!NOTE]
          > Mac OS will need to use the Homebrew cask version of sqlite3 in order to load an extension. The default system `sqlite3` disables loading external extensions for security.

          #### 2. Run SQLite3 and load the VFS:

          Make sure you run `sqlite3` (on macOS, you may need a Homebrew-installed version of `sqlite3` to allow loading extensions):

          ```sql
          -- Load the extension (omit the file extension)
          .load ./libsqlite3_gcsvfs

          -- Open a database file using the appendonly VFS
          .open file:demo.db?vfs=appendonly

          -- Perform SQL operations
          CREATE TABLE demo_table(id INTEGER PRIMARY KEY, message TEXT);
          INSERT INTO demo_table (message) VALUES ('SQLite VFS loaded successfully!');
          SELECT * FROM demo_table;
          .exit
          ```

          ### Log Import/Export CLI Tool

          To download the `sqlite_log_tool` import/export CLI:

          **macOS (Apple Silicon arm64):**
          ```bash
          curl -L -o sqlite_log_tool https://github.com/fatlotus/sqlite-on-gcs-rapid/releases/download/${{ steps.version.outputs.version }}/sqlite_log_tool-macos-arm64
          chmod +x sqlite_log_tool
          ```

          **Linux (x86_64):**
          ```bash
          curl -L -o sqlite_log_tool https://github.com/fatlotus/sqlite-on-gcs-rapid/releases/download/${{ steps.version.outputs.version }}/sqlite_log_tool-linux-x86_64
          chmod +x sqlite_log_tool
          ```
          EOF

          gh release create ${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            release-assets/*

