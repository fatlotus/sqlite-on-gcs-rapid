name: Build SQLite VFS Extension

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-linux-64:
    name: Build 64-bit Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install Bazel (fallback for act)
        run: |
          if ! command -v bazel &> /dev/null; then
            echo "Bazel not found. Installing Bazelisk..."
            sudo curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 || curl -Lo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
            sudo chmod +x /usr/local/bin/bazel || chmod +x /usr/local/bin/bazel
          fi

      - name: Build shared library
        run: |
          bazel build //:libsqlite3_gcsvfs.so \
            --features=-layering_check \
            --features=-use_header_modules \
            --features=-module_maps \
            --disk_cache=.cache/bazel-disk-cache > build_log.txt 2>&1

      - name: Push failure log to git
        if: failure()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b build-failure-log-linux
          if [ -f build_log.txt ]; then
            git add build_log.txt
            git commit -m "ci: add build failure log for linux 64-bit"
            git push origin build-failure-log-linux --force
          fi
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite3_gcsvfs-linux-x86_64
          path: bazel-bin/libsqlite3_gcsvfs.so

  build-macos-arm:
    name: Build ARM macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build shared library
        run: |
          bazel build //:libsqlite3_gcsvfs.so \
            --features=-layering_check \
            --features=-use_header_modules \
            --features=-module_maps \
            --disk_cache=.cache/bazel-disk-cache > build_log.txt 2>&1

      - name: Push failure log to git
        if: failure()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b build-failure-log-macos
          if [ -f build_log.txt ]; then
            git add build_log.txt
            git commit -m "ci: add build failure log for macos"
            git push origin build-failure-log-macos --force
          fi
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite3_gcsvfs-macos-arm64
          path: bazel-bin/libsqlite3_gcsvfs.so

  release:
    name: Create GitHub Release
    needs: [build-linux-64, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: libsqlite3_gcsvfs-linux-x86_64
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: libsqlite3_gcsvfs-macos-arm64
          path: ./artifacts/macos

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp ./artifacts/linux/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-linux-x86_64.so
          cp ./artifacts/macos/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-macos-arm64.so
          cp ./artifacts/macos/libsqlite3_gcsvfs.so release-assets/libsqlite3_gcsvfs-macos-arm64.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for version ${{ github.ref_name }}" \
            release-assets/*
